statuses: [backlog, todo, in-progress, in-review, done, cancelled]
autoCommit: false
# Run by the merge queue in each run's own worktree after a clean rebase and
# before the squash-merge, so a branch that breaks the build never lands. A
# worktree is a fresh checkout with no node_modules or dist/, and @dispatch/*
# resolve through exports maps pointing at dist/ — so install and build have to
# come first or lint/test fail on unresolved workspace imports rather than on
# anything real. Mirrors what CI gates on (build -> lint -> test); takes ~2 min
# per entry.
verifyCommand: "bun install --frozen-lockfile && bun run build && bun run lint && bun run test"

# maxTurns is a runaway backstop, not a work budget — 100 killed a healthy
# run mid-task at turn 101. Config reloads per dispatch, so this takes
# effect on the next run without a daemon restart.
orchestrator:
  maxTurns: 500
