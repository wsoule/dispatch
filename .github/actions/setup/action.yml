name: Set up moon and caches
description: >-
  Install the proto-pinned toolchain (.prototools is the single source of truth)
  and cache the proto tools, pnpm store, and moon's shareable cache (hashes +
  outputs; states is machine-local run state).

runs:
  using: composite
  steps:
    - name: Cache proto toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.proto
        key: ${{ runner.os }}-proto-${{ hashFiles('.prototools') }}

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Cache moon hashes and outputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .moon/cache/hashes
          .moon/cache/outputs
        key: ${{ runner.os }}-moon-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-moon-

    # Installs proto, then provisions every .prototools pin (bun, pnpm, node,
    # moon, gh). Its internal actions/cache layer is off: ~/.proto is cached
    # above.
    - name: Install proto and moon
      uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      with:
        auto-install: true
        cache: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
