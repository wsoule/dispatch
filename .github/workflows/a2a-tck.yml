name: A2A TCK

# The official A2A TCK's MUST level against handleA2A, on changes to the
# package. Outside moon ci: it needs Python 3.11, uv and a clone of the TCK.
on:
  pull_request:
    paths:
      - 'packages/a2a/**'
      - '.github/workflows/a2a-tck.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/a2a/**'

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  tck:
    name: A2A TCK (MUST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # moon compares against main on a pull request; a shallow clone has no main.
          fetch-depth: 0

      - name: Set up moon and caches
        uses: ./.github/actions/setup

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'

      - name: Run the TCK
        run: moonx a2a:tck --ignore-ci-checks

      - name: Upload the compatibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a2a-tck-report
          path: .agents/ignore/a2a-tck-compatibility.json
          # The report sits under .agents/, which the action skips by default.
          include-hidden-files: true
