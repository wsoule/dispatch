name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup

      - name: Format check
        run: bun run format:check

      # `tsc` (tsgo) and oxlint's type-aware rules both resolve workspace
      # packages through each package.json's `exports` field, which points at
      # `dist/*`. That output only exists after a build, so Build must run
      # before Lint and TypeScript here or every cross-package import (e.g.
      # @dispatch/cli importing @dispatch/core) fails — as a hard "Cannot find
      # module" for tsc, and as silent `any`-typed imports for the linter,
      # which then trips strict-boolean-expressions/no-unsafe-* errors that
      # never reproduce locally (where dist/ is usually already built).
      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Stylelint
        run: bun run lint:css

      # Runs after Build for the same reason Lint does: knip resolves
      # cross-package imports through each package.json's `exports` field,
      # which points at dist/*.
      - name: Dead code
        run: bun run lint:deadcode

      - name: TypeScript
        run: bun run tsc

      - name: Tests
        run: bun run test

  desktop:
    name: Desktop (JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup

      # The root `build`/`test` scripts only run across `packages/*` (see
      # package.json), so apps/desktop's frontend needs its own build/test
      # invocation here rather than riding along with the `verify` job.
      # Workspace packages must be built first for the same reason Verify
      # builds before linting: the desktop tsc resolves @dispatch/* through
      # exports maps pointing at dist/*, which only exists after a build.
      - name: Build workspace packages
        run: bun run build

      - name: Build desktop frontend
        run: bun ws desktop build

      - name: Test desktop frontend
        run: bun ws desktop test

  rust:
    name: Rust (apps/desktop/src-tauri)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri

      # `apps/desktop/src-tauri` is not fmt-clean or clippy-clean as-is:
      # `cargo fmt --check` reformats
      # dozens of pre-existing lines, and `cargo clippy -- -D warnings` fails on
      # pre-existing findings (an unused import, a manual range-contains, two
      # too-many-arguments functions, a `.nth(0)` call). Both were verified
      # locally before writing this job. Re-run them by hand after a
      # re-vendoring pass and gate on them once the vendored code is clean;
      # for now only `cargo test`, which is green, is enforced.
      # tauri-build's build script errors if any bundle resource is missing.
      # The sidecar binaries are gitignored build products (release.yml builds
      # the real ones); cargo test never runs them, so empty placeholders do.
      - name: Create placeholder sidecar resources
        working-directory: apps/desktop/src-tauri
        run:
          touch resources/dispatchd resources/dispatch-mcp
          resources/dispatch-cli

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  actions-pinned:
    name: Actions pinned to SHA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify external actions are pinned to a full commit SHA
        run: |
          set -euo pipefail
          unpinned=$(
            grep -rEn '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^.[:space:]]' .github \
              | grep -vE 'uses:[[:space:]]*[^[:space:]]+@[0-9a-fA-F]{40}([[:space:]]|#|"|'"'"'|$)' \
              || true
          )
          if [ -n "$unpinned" ]; then
            echo "::error::These actions are not pinned to a full commit SHA:"
            echo "$unpinned"
            echo "Pin each to a 40-character commit SHA, e.g. owner/repo@<sha> # vX.Y.Z"
            exit 1
          fi
          echo "All external actions are pinned to a full commit SHA."
