name: CI

on:
  push:
    branches:
      - main
  pull_request:

# moon disables color in CI, but Vite forces ANSI when it sees
# GITHUB_ACTIONS; NO_COLOR keeps raw logs clean for humans and agents.
env:
  NO_COLOR: 1

jobs:
  ci:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # moon diffs against the merge base to compute affected projects.
          fetch-depth: 0

      - name: Set up moon and caches
        uses: ./.github/actions/setup

      # The explicit target list below DEFINES what moon ci runs — it filters,
      # it does not just add entry points. A root-level task with
      # runInCI: 'always' that is missing from this list does NOT join the
      # run on its own; add new checks here explicitly.
      - name: moon ci
        run: >-
          moon ci :build :typecheck :test root:format-check root:lint
          root:lint-css root:lint-deadcode root:lint-dup root:lint-arch
          root:lint-spelling root:lint-md root:lint-types root:lint-chrome
          root:check-licenses root:audit

      - name: Audit (full report)
        run: pnpm audit
        continue-on-error: true

  rust:
    name: Rust (apps/desktop/src-tauri)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri

      # `apps/desktop/src-tauri` is not fmt-clean or clippy-clean as-is:
      # `cargo fmt --check` reformats
      # dozens of pre-existing lines, and `cargo clippy -- -D warnings` fails on
      # pre-existing findings (an unused import, a manual range-contains, two
      # too-many-arguments functions, a `.nth(0)` call). Both were verified
      # locally before writing this job. Re-run them by hand after a
      # re-vendoring pass and gate on them once the vendored code is clean;
      # for now only `cargo test`, which is green, is enforced.
      # tauri-build's build script errors if any bundle resource is missing.
      # The sidecar binaries are gitignored build products (release.yml builds
      # the real ones); cargo test never runs them, so empty placeholders do.
      - name: Create placeholder sidecar resources
        working-directory: apps/desktop/src-tauri
        run:
          touch resources/dispatchd resources/dispatch-mcp
          resources/dispatch-cli

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  actions-pinned:
    name: Actions pinned to SHA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify external actions are pinned to a full commit SHA
        run: |
          set -euo pipefail
          unpinned=$(
            grep -rEn '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^.[:space:]]' .github \
              | grep -vE 'uses:[[:space:]]*[^[:space:]]+@[0-9a-fA-F]{40}([[:space:]]|#|"|'"'"'|$)' \
              || true
          )
          if [ -n "$unpinned" ]; then
            echo "::error::These actions are not pinned to a full commit SHA:"
            echo "$unpinned"
            echo "Pin each to a 40-character commit SHA, e.g. owner/repo@<sha> # vX.Y.Z"
            exit 1
          fi
          echo "All external actions are pinned to a full commit SHA."
