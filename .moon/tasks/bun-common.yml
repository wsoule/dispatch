$schema: 'https://moonrepo.dev/schemas/tasks.json'

# Tasks shared by every JS/TS project. Only string-identical tasks belong
# here; per-project variance lives in that project's moon.yml.
inheritedBy:
  languages: ['typescript', 'javascript']

# package.json: manifest changes must re-trigger tasks. tsconfig.options.json:
# every package tsconfig extends it and several builds emit declarations, so
# compiler-option changes must re-key everything.
#
# pnpm-workspace.yaml and pnpm-lock.yaml matter for a reason that is easy to
# miss: packages pin dependencies as `catalog:`, so a version bump touches
# NEITHER any package.json NOR any source file. Without these two here, raising
# react or typescript in the catalog leaves every build, typecheck and test
# cache-valid, and CI reports green without compiling a line against the new
# version. The lockfile is listed as well as the catalog because an override,
# a transitive resolution or a `pnpm update` can move a real dependency without
# the catalog changing at all.
implicitInputs:
  - 'package.json'
  - '/tsconfig.options.json'
  - '/pnpm-workspace.yaml'
  - '/pnpm-lock.yaml'

tasks:
  # Tests import workspace deps through their built dist (same resolution as
  # typecheck), so dependency builds must complete first.
  test:
    command: 'bun test'
    deps:
      - '^:build'

  # Cross-package imports resolve through each dependency's dist (no TS
  # project references), so dependencies build before typecheck.
  typecheck:
    command: 'tsgo --noEmit --pretty'
    deps:
      - '^:build'
    inputs:
      - '**/*'
      - '!node_modules/**'
      - '!dist/**'
      - '!**/*.tsbuildinfo'
      - '!src-tauri/target/**'
