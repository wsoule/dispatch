$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Fail fast when a developer's proto-installed moon drifts from the repo pin
# in .prototools; both must move together.
versionConstraint: '2.3.3'

projects:
  globs:
    - 'packages/*'
    - 'apps/*'
  sources:
    # Repo-wide tooling (lint, format, clean) lives on the root project.
    root: '.'

vcs:
  client: 'git'
  defaultBranch: 'main'
  # moon generates .moon/hooks/* (gitignored) and points the worktree-local
  # core.hooksPath at it — every clone and worktree gets hooks from any moon
  # command, with no install-time side effect like husky's prepare.
  sync: true
  hooks:
    pre-commit:
      # Typecheck the projects affected by staged files, then let lint-staged
      # format and lint-fix exactly those files and re-stage the result.
      #
      # `moon run root:format` used to sit between these two and was removed:
      # it runs `oxfmt .` over the WHOLE worktree, so committing one file could
      # rewrite unstaged edits, untracked scratch files, and — the case that
      # actually bit us — the carto-generated block in AGENTS.md. In this repo
      # that is worse than untidy: several agent sessions share a checkout, so
      # a repo-wide rewrite during one session's commit lands in another's
      # diff. lint-staged already runs `oxfmt --write` on the staged files,
      # which is the only formatting a commit hook has any business doing.
      - 'moon exec :typecheck --affected --status staged'
      - 'pnpm exec lint-staged'
