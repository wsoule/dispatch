$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'sandbox'

language: 'typescript'
layer: 'application'

tasks:
  dev:
    command: 'bun run src/server.ts'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
  # The demo imports and spawns the daemon, which loads server's dependencies
  # from dist; `^:build` never reaches them, since server has no build task.
  typecheck:
    deps:
      - 'server:build-deps'
  test:
    deps:
      - 'server:build-deps'
