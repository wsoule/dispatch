<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dispatch — live demo</title>
    <meta
      name="description"
      content="A throwaway sandbox running the real Dispatch app against a seeded repo. Nothing you do here is saved."
    />
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root {
        /* The app's own tokens, mirroring apps/site/public/index.html. */
        --ground: #0e0f11;
        --panel: #17181c;
        --line: #23252a;
        --ink: #f7f8f8;
        --muted: #858991;
        --dim: #5b5f66;
        --indigo: #7c86e8;
        --del: #e5595b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--ground);
        color: var(--ink);
        font:
          16px/1.55 system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 460px;
        text-align: center;
      }
      .logo {
        font-family: ui-monospace, monospace;
        letter-spacing: -0.02em;
        color: var(--muted);
        font-size: 14px;
      }
      .logo b {
        color: var(--indigo);
        font-weight: 500;
      }
      h1 {
        margin: 14px 0 10px;
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #10111a;
        background: var(--indigo);
        border: 0;
        border-radius: 8px;
        padding: 11px 22px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.08);
      }
      button:disabled {
        cursor: progress;
        opacity: 0.6;
      }
      :focus-visible {
        outline: 2px solid var(--indigo);
        outline-offset: 3px;
      }
      #status {
        min-height: 22px;
        margin: 16px 0 0;
        font-size: 14px;
      }
      #status.error {
        color: var(--del);
      }
      .fine {
        margin: 26px 0 0;
        font-size: 12px;
        color: var(--dim);
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="logo">dis<b>patch</b></p>
      <h1>A live Dispatch sandbox, yours for 30 minutes.</h1>
      <p>
        The real app, a seeded storefront repo, and agents you can dispatch —
        running on our machine, not yours.
      </p>
      <button id="start" type="button">Launch the live demo</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="fine">
        Agents here are scripted, not real models. The sandbox resets after 30
        minutes of inactivity and nothing you do in it is saved.
      </p>
    </main>
    <script>
      const button = document.getElementById('start');
      const status = document.getElementById('status');
      // Carried through to the session page so the embedded iframe on the
      // marketing site gets the chrome-less build of the same UI.
      const embed = new URLSearchParams(location.search).get('embed') === '1';

      function fail(message) {
        status.className = 'error';
        status.textContent = message;
        button.disabled = false;
        button.textContent = 'Try again';
      }

      async function start() {
        button.disabled = true;
        status.className = '';
        status.textContent = 'Seeding a fresh repo and starting a daemon…';
        try {
          const res = await fetch('/session', { method: 'POST' });
          if (res.status === 503) {
            fail('Every sandbox is busy right now. Try again in a minute.');
            return;
          }
          if (!res.ok) {
            fail("The sandbox didn't start. Try again in a moment.");
            return;
          }
          const { id } = await res.json();
          location.href = `/s/${id}/${embed ? '?embed=1' : ''}`;
        } catch {
          fail('Could not reach the demo server. Check your connection.');
        }
      }

      button.addEventListener('click', () => void start());
      // A session costs a repo clone and a daemon, so it is only ever spent on
      // an explicit click — or on the embed, which is itself click-gated by
      // the card that loads this page in an iframe.
      if (embed) void start();
    </script>
  </body>
</html>
