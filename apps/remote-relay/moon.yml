$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  # The container entrypoint (Dockerfile), not a dev server.
  start:
    command: 'bun run src/main.ts'
    deps:
      - '^:build'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
