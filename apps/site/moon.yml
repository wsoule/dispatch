$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  dev:
    command: 'bun run server.ts'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'

  # No test files exist for this app; the inherited bun-common test task
  # otherwise fails with "0 test files matching".
  test:
    command: 'bun test --pass-with-no-tests'
