$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

# test/mesh.test.ts spawns the real machine hub from packages/mcp/dist; the
# @dispatch-foo/mcp devDependency puts that build in the inherited `^:build`.

tasks:
  # Each hosted workspace's daemon embeds the server, which loads its
  # dependencies from dist; `^:build` never reaches them, since server has no
  # build task (as in apps/demo).
  typecheck:
    deps:
      - 'server:build-deps'
  test:
    deps:
      - 'server:build-deps'
  # Local server with DEV_LOGIN (sign in without GitHub) on http://localhost.
  dev:
    command: 'bun --watch src/main.ts'
    env:
      DEV_LOGIN: '1'
      PORT: '8787'
      DATA_DIR: './data'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
