[install]

minimumReleaseAge = 604800 # 7 days in seconds
minimumReleaseAgeExcludes = ["@types/bun", "@pierre/diffs"]

[test]

# Covers `bun test <path>` run from the repo root; each listed package's own
# bunfig.toml carries the matching preload for runs whose cwd is that package.
preload = ["./packages/server/test/setup.ts", "./packages/cli/test/setup.ts"]
