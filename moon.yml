$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

# Type-aware lint resolves @dispatch/* through each package's built dist,
# so the root project depends on every dist-producing project.
dependsOn:
  - 'core'
  - 'client'
  - 'cli'
  - 'mcp'
  - 'desktop'

# Every repo-wide lane below scans from the root, and every one of them has to
# exclude the same set of generated and vendored trees. That block was copied
# into nine tasks and had already drifted — only some of them excluded
# .moon/cache and .moon/hooks, so a moon run would spuriously invalidate the
# lanes that missed it. One definition, referenced as @group(scan-excluded).
fileGroups:
  scan-excluded:
    - '!**/node_modules/**'
    - '!**/dist/**'
    - '!**/src-tauri/target/**'
    - '!**/test-results/**'
    - '!**/playwright-report/**'
    - '!.moon/cache/**'
    - '!.moon/hooks/**'
    - '!.agents/ignore/**'
    - '!.superpowers/**'
    - '!.dispatch/**'

workspace:
  inheritedTasks:
    # No root tsconfig to typecheck; root `bun test` would run every suite.
    exclude: ['test', 'typecheck']

tasks:
  lint:
    command: 'oxlint --type-aware --tsconfig tsconfig.oxlint.json .'
    deps:
      - '^:build'
    inputs:
      - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      - '@group(scan-excluded)'
      - '.oxlintrc.json'
      - 'tsconfig.oxlint.json'
    options:
      runInCI: 'always'

  lint-fix:
    command: 'oxlint --type-aware --tsconfig tsconfig.oxlint.json --fix .'
    deps:
      - '^:build'
    options:
      cache: false
      runInCI: 'skip'

  lint-css:
    script: 'stylelint "**/*.css" --allow-empty-input'
    inputs:
      - '**/*.css'
      - '@group(scan-excluded)'
      - 'stylelint.config.js'
    options:
      runInCI: 'always'

  # Skipped in CI for the same reason lint-fix is: it rewrites source. Run it
  # from a CI-marked shell (an agent harness) with --ignore-ci-checks.
  lint-css-fix:
    script: 'stylelint "**/*.css" --allow-empty-input --fix'
    options:
      cache: false
      runInCI: 'skip'

  format:
    command: 'oxfmt .'
    options:
      cache: false
      runInCI: 'always'

  format-check:
    command: 'oxfmt --check .'
    inputs:
      - '**/*'
      - '@group(scan-excluded)'
    options:
      runInCI: 'always'

  # knip resolves cross-package imports through exports maps pointing at
  # dist/*, so builds must run first (same reason as lint).
  lint-deadcode:
    command: 'knip'
    deps:
      - '^:build'
    inputs:
      - '**/*.{js,jsx,ts,tsx}'
      - '@group(scan-excluded)'
      - 'knip.json'
    options:
      runInCI: 'always'

  # knip --fix deletes unused exports and files. Skipped in CI like the other
  # fix lanes; run it with `moonx root:lint-deadcode-fix --ignore-ci-checks`.
  lint-deadcode-fix:
    command: 'knip --fix'
    deps:
      - '^:build'
    options:
      cache: false
      runInCI: 'skip'

  lint-dup:
    command: 'jscpd packages apps'
    inputs:
      - 'packages/**/*'
      - 'apps/**/*'
      - '@group(scan-excluded)'
      - '.jscpd.json'
    options:
      runInCI: 'always'

  lint-arch:
    command: 'depcruise packages apps'
    inputs:
      - 'packages/**/*.{ts,tsx}'
      - 'apps/**/*.{ts,tsx}'
      - '@group(scan-excluded)'
      - '.dependency-cruiser.json'
    options:
      runInCI: 'always'

  lint-spelling:
    command: 'cspell --no-progress --no-summary --show-suggestions .'
    inputs:
      - '**/*'
      - '@group(scan-excluded)'
      - 'cspell.json'
      - '.cspell-dictionary.txt'
    options:
      runInCI: 'always'

  lint-md:
    command: 'markdownlint-cli2'
    inputs:
      - '**/*.md'
      - '@group(scan-excluded)'
      - '.markdownlint-cli2.jsonc'
    options:
      runInCI: 'always'

  lint-types:
    command: 'type-coverage -p tsconfig.oxlint.json'
    deps:
      - '^:build'
    options:
      runInCI: 'always'

  lint-chrome:
    command: 'bun scripts/check-chrome-utilities.ts'
    inputs:
      - 'scripts/check-chrome-utilities.ts'
      - 'apps/desktop/src/**/*'
    options:
      runInCI: 'always'

  # Through audit-gate.ts: a critical advisory fails; an unreachable registry
  # warns and passes — npm timeouts failed two otherwise-green CI runs.
  audit:
    command: 'bun --silent scripts/audit-gate.ts'
    inputs:
      - 'scripts/audit-gate.ts'
      - 'pnpm-lock.yaml'
    options:
      cache: false
      runInCI: 'always'

  audit-full:
    command: 'pnpm audit'
    options:
      cache: false
      # Informational; CI marks it continue-on-error at the workflow level.
      runInCI: 'skip'

  # Both stay CI-skipped on purpose. `moon ci` with no explicit targets runs
  # every affected task that is not skipped, so an eligible clean-all would
  # delete node_modules midway through the pipeline that is using it. The
  # workflow does pass an explicit target list today, but that is a property of
  # one file rather than a guarantee. From a CI-marked shell (an agent
  # harness), run them with --ignore-ci-checks.
  clean:
    script:
      'rm -rf packages/*/dist apps/*/dist dist-sidecar
      packages/*/tsconfig.tsbuildinfo apps/*/tsconfig.tsbuildinfo'
    options:
      cache: false
      runInCI: 'skip'

  clean-all:
    script:
      'rm -rf packages/*/dist apps/*/dist dist-sidecar node_modules
      packages/*/node_modules apps/*/node_modules'
    options:
      cache: false
      runInCI: 'skip'

  check-licenses:
    command: 'bun --silent scripts/check-licenses.ts'
    inputs:
      - 'scripts/check-licenses.ts'
      - '**/package.json'
      - '**/LICENSE*'
      - '@group(scan-excluded)'
    options:
      runInCI: 'always'

  # Compiles packages/server into a standalone `bun build --compile` binary and
  # smoke-boots it. Bun-specific by design: the shipped daemon IS a compiled Bun
  # executable, so this must not be routed through node or pnpm.
  build-sidecar:
    command: 'bun scripts/build-sidecar.ts'
    deps:
      - '^:build'
    options:
      cache: false
      runInCI: 'skip'

  # Guards ci.yml's `moon ci` target list against the root task graph. Six lint
  # lanes were dark on main because those two are independent bookkeeping.
  check-ci-targets:
    command: 'bun --silent scripts/check-ci-targets.ts'
    inputs:
      - 'scripts/check-ci-targets.ts'
      - 'moon.yml'
      - '.github/workflows/ci.yml'
    options:
      # Shells out to `moon query`, which must not be cached against a stale
      # graph.
      cache: false
      runInCI: 'always'

  # Guards the build graph against tests that spawn their own build output
  # without an edge to it. cli:test and mcp:test raced their own builds on a
  # cold CI checkout while passing locally against a warm dist/.
  check-own-build-deps:
    command: 'bun --silent scripts/check-own-build-deps.ts'
    inputs:
      - 'scripts/check-own-build-deps.ts'
      - '/packages/*/moon.yml'
      - '/apps/*/moon.yml'
      - '/.moon/tasks/*.yml'
    options:
      # Shells out to `moon query`, which must not be cached against a stale
      # graph.
      cache: false
      runInCI: 'always'

  # Worktree manager (create/list/remove dispatch worktrees with port
  # offsets). Forward args with `moonx root:wt -- <args>`.
  wt:
    command: 'bun --silent scripts/wt.ts'
    options:
      cache: false
      interactive: true
      runInCI: 'always'
