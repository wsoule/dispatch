$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'library'
tags: ['tsdown', 'publishable']

tasks:
  # test/e2e.test.ts spawns this project's own dist/bin.js, so it needs its own
  # build, not only `^:build`; tsdown --clean would otherwise race the spawn.
  # test/run-list.test.ts spawns dispatchd, which loads server's dependencies
  # from dist; `^:build` never reaches them, since server has no build task.
  test:
    deps:
      - 'build'
      - 'server:build-deps'
    # **/* is written out: an override that listed only the appendix would
    # replace the inherited default inputs.
    inputs:
      - '**/*'
      - '/packages/protocol-spec/spec/appendix-b-agent-tools.md'
