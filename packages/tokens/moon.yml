$schema: 'https://moonrepo.dev/schemas/project.json'

# CSS only: tokens.css is consumed straight through the package exports map by
# apps/desktop (src/main.tsx) and apps/site (src/layouts/Base.astro), both of
# which inline it into their bundles. There is nothing here to build, typecheck
# or test.
#
# The language is left unset deliberately — declaring it as typescript would
# inherit .moon/tasks/bun-common.yml's test and typecheck tasks, which have no
# tsconfig and no test files to run against.
#
# NO BUILD TASK ON PURPOSE. A `noop` build here does not make consumers
# cache-correct: as measured against the moon version pinned when this was
# written, moon did not fold a dependency task's hash into its dependents',
# so tokens:build re-ran while desktop:build and site:build stayed cached and
# shipped the previous palette. The staleness is fixed the only way that
# works regardless of moon version — each consumer lists
# `/packages/tokens/tokens.css` in its own build inputs. If you add a second
# file here, add it there too.
layer: 'library'
