$schema: 'https://moonrepo.dev/schemas/project.json'

# CSS only: tokens.css is consumed straight through the package exports map,
# so there is nothing here to build, typecheck, or test. The language is left
# unset deliberately — declaring it as typescript would inherit
# .moon/tasks/bun-common.yml's test and typecheck tasks, which have no tsconfig
# and no test files to run against. It is declared as a project purely so the
# desktop and site builds carry a real edge to it on the moon graph.
layer: 'library'
