$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  build:
    command: 'vite build'
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
    outputs:
      - 'dist'

  dev:
    command: 'vite'
    deps:
      - '^:build'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
