packages:
  - packages/*
  - apps/*

# bunfig.toml's `minimumReleaseAge = 604800` (seconds) in pnpm's units. Same
# intent: refuse a dependency published less than a week ago, so a compromised
# or accidentally-broken release has time to be caught before it can land here.
minimumReleaseAge: 10080 # minutes = 7 days
# Packages exempted from the age gate. Two reasons appear here:
#   - @types/bun and the @pierre/* packages track our own fast-moving upstreams
#     and were already exempt under bunfig (minimumReleaseAgeExcludes).
#   - everything else is a platform-specific binary published in lockstep with
#     its parent package. The age gate is evaluated per package, so a parent
#     old enough to install can still fail on a sibling binary that pnpm only
#     resolves for the current platform. Exempting the binaries keeps the gate
#     meaningful on the packages a human actually chooses.
minimumReleaseAgeExclude:
  - '@types/bun'
  - '@pierre/diffs'
  - '@pierre/trees'
  - '@moonrepo/cli'
  - '@typescript/native-preview'
  - 'vite'
  - '@moonrepo/core-linux-arm64-gnu'
  - '@moonrepo/core-linux-arm64-musl'
  - '@moonrepo/core-linux-x64-gnu'
  - '@moonrepo/core-linux-x64-musl'
  - '@moonrepo/core-macos-arm64'
  - '@moonrepo/core-macos-x64'
  - '@moonrepo/core-windows-x64-msvc'
  - '@rolldown/binding-android-arm64'
  - '@rolldown/binding-darwin-arm64'
  - '@rolldown/binding-darwin-x64'
  - '@rolldown/binding-freebsd-x64'
  - '@rolldown/binding-linux-arm-gnueabihf'
  - '@rolldown/binding-linux-arm64-gnu'
  - '@rolldown/binding-linux-arm64-musl'
  - '@rolldown/binding-linux-ppc64-gnu'
  - '@rolldown/binding-linux-s390x-gnu'
  - '@rolldown/binding-linux-x64-gnu'
  - '@rolldown/binding-linux-x64-musl'
  - '@rolldown/binding-openharmony-arm64'
  - '@rolldown/binding-wasm32-wasi'
  - '@rolldown/binding-win32-arm64-msvc'
  - '@rolldown/binding-win32-x64-msvc'
  - '@typescript/native-preview-darwin-arm64'
  - '@typescript/native-preview-darwin-x64'
  - '@typescript/native-preview-linux-arm'
  - '@typescript/native-preview-linux-arm64'
  - '@typescript/native-preview-linux-x64'
  - '@typescript/native-preview-win32-arm64'
  - '@typescript/native-preview-win32-x64'
  - 'rolldown'

# pnpm refuses to run any dependency's install lifecycle script unless it is
# named here, and hard-fails the install otherwise. Bun ran these silently off
# its own built-in trusted list, so this allowlist is new — and it is the point:
# an install-time script is arbitrary code execution, which is exactly what the
# minimumReleaseAge gate above is guarding against. Each entry needs a reason.
onlyBuiltDependencies:
  # Downloads the `railway` binary that apps/site's deploy task shells out to.
  - '@railway/cli'
  # Places the platform-specific native binary; astro's build fails without it.
  - 'esbuild'
  # Native libvips bindings for astro:assets image optimization.
  - 'sharp'

# GHSA-23hp-3jrh-7fpw ("node-tar: Decompression/parse DoS via unlimited input",
# vulnerable <=7.5.18) is the one CRITICAL `pnpm audit` reports, and it is
# inherited, not introduced: @railway/cli pins `tar: ^6.1.11` and every 6.x is
# affected. It is equally red on main today under `bun audit`.
#
# It cannot be overridden. Forcing the patched 7.5.19 across the major boundary
# breaks @railway/cli's own postinstall on a clean install — tar 7 removed the
# default export, and `import tar from "tar"` in its postinstall.js dies with
# "The requested module 'tar' does not provide an export named 'default'". (An
# override LOOKS like it works if node_modules is already populated, because
# the railway binary is already unpacked. It is not.)
#
# Accepted because the blast radius is nil: @railway/cli is a devDependency of
# apps/site only, used by hand for `moonx site:deploy`, and apps/site's Docker
# image copies just server.ts and the prebuilt dist/ — it installs no
# node_modules at all, so this never reaches a running service. Drop this entry
# the moment @railway/cli ships a tar ^7 range.
auditConfig:
  ignoreGhsas:
    - 'GHSA-23hp-3jrh-7fpw'

# Carried over verbatim from the root package.json's `overrides`.
overrides:
  '@types/node': '24.13.2'
  'typescript': '5.9.2'

